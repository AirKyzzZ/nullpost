# Pipeline CI/CD, NullPost
#
# Declenche sur chaque push ou pull request vers main.
# Etapes:
# 1. Lint (ESLint), verifie la qualite du code
# 2. Tests unitaires + integration (Vitest), verifie la logique metier
# 3. Build Next.js, verifie que l'application compile
# 4. Tests E2E (Playwright), verifie l'application complete dans un navigateur
#    (non bloquant en CI: certains scenarios necessitent un OAuth GitHub reel)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/test.db
      AUTH_SECRET: test-secret-ci-only
      AUTH_GITHUB_ID: x
      AUTH_GITHUB_SECRET: x
      ALLOWED_GITHUB_USER: testuser
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare data directory
        run: mkdir -p ./data

      - name: Lint
        run: npm run lint

      - name: Unit + Integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    continue-on-error: true # Non bloquant: les scenarios proteges necessitent OAuth GitHub reel
    env:
      DATABASE_URL: file:./data/test.db
      AUTH_SECRET: test-secret-ci-only
      AUTH_GITHUB_ID: x
      AUTH_GITHUB_SECRET: x
      ALLOWED_GITHUB_USER: testuser
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare data directory
        run: mkdir -p ./data

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (smoke only)
        run: npm run test:e2e -- tests/e2e/landing.spec.ts tests/e2e/rgpd.spec.ts tests/e2e/api.spec.ts
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
