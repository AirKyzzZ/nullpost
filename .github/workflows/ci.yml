# Pipeline CI/CD — NullPost
#
# Déclenché sur chaque push ou pull request vers main.
# Étapes :
# 1. Lint (ESLint) — Vérifie la qualité du code
# 2. Tests unitaires + intégration (Vitest) — Vérifie la logique métier
# 3. Build Next.js — Vérifie que l'application compile
# 4. Tests E2E (Playwright) — Vérifie l'application complète dans un navigateur

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1 : Lint + Tests unitaires + Build ──
  ci:
    runs-on: ubuntu-latest

    # Variables d'environnement pour les tests
    # (valeurs factices — pas de vrais secrets en CI)
    env:
      DATABASE_URL: file:./data/test.db
      AUTH_SECRET: test-secret-ci-only
      AUTH_GITHUB_ID: x
      AUTH_GITHUB_SECRET: x
      ALLOWED_GITHUB_USER: testuser
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + Integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # ── Job 2 : Tests E2E (Playwright) ──
  e2e:
    runs-on: ubuntu-latest
    needs: ci # Attend que le job ci passe avant de lancer les E2E

    env:
      DATABASE_URL: file:./data/test.db
      AUTH_SECRET: test-secret-ci-only
      AUTH_GITHUB_ID: x
      AUTH_GITHUB_SECRET: x
      ALLOWED_GITHUB_USER: testuser
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
